# Runs the tests for every push to main and every pull request. A tag like
# v1.2.0 also builds the DMG and publishes it as a GitHub release:
#
#   git tag v1.2.0 && git push origin v1.2.0
#
# The version comes from the tag and the build number from the run number,
# so nothing in the project has to change for a release.
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Test
        run: xcodebuild -project ClaudeRing.xcodeproj -scheme ClaudeRing -destination 'platform=macOS' test

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: macos-26
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - name: Select the newest Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | grep -iv beta | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Build the DMG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::The tag $GITHUB_REF_NAME is not of the form vMAJOR.MINOR.PATCH."
            exit 1
          fi
          VERSION="$VERSION" BUILD_NUMBER="$GITHUB_RUN_NUMBER" scripts/make-dmg.sh
          # A name without version, so releases/latest/download/ClaudeRing.dmg
          # always points to the newest release.
          cp "build/dist/ClaudeRing-$VERSION.dmg" build/dist/ClaudeRing.dmg
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "build/dist/ClaudeRing-$VERSION.dmg" build/dist/ClaudeRing.dmg \
            --title "Claude Ring $VERSION" --generate-notes --verify-tag
